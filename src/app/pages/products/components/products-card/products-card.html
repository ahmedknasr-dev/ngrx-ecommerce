<div class="card h-100">
  <div class="card-body d-flex flex-column">
    <div class="row">
      <div class="col-3">
        <img
          [ngSrc]="product().imageUrl"
          [alt]="product().productName"
          class="product-image rounded"
          width="80"
          height="80"
          priority
        />
      </div>
      <div class="col-9">
        <h5 class="card-title">{{ product().productName }}</h5>
        <p class="text-muted small mb-1">Brand: {{ product().brandName }} • Category: {{ product().description }}</p>
        <p class="fw-bold text-primary mb-0">{{ product().price | currency }}</p>
      </div>
    </div>
    <div class="mt-auto pt-3">
      <button type="button" class="btn btn-primary w-100" (click)="onAddToCart()">
        <i class="bi bi-cart-plus me-2"></i>
        Add to Cart
      </button>
    </div>
  </div>
</div>
