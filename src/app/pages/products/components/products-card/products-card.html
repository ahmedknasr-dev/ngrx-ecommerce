<div class="card h-100">
  <div class="card-body">
    <div class="row align-items-center">
      <div class="col-3">
        <img
          [ngSrc]="product().imageUrl"
          [alt]="product().productName"
          class="product-image rounded"
          width="100"
          height="100"
          priority
        />
      </div>
      <div class="col-6">
        <h5 class="card-title mb-2">{{ product().productName }}</h5>
        <p class="text-muted small mb-1">Brand: {{ product().brandName }}</p>
        <p class="fw-bold text-primary mb-0">{{ product().price | currency }}</p>
      </div>
      <div class="col-3 d-flex align-items-center justify-content-end">
        <button type="button" class="btn btn-primary" (click)="onAddToCart()">
          <i class="bi bi-cart-plus"></i>
          <span class="d-none d-lg-inline ms-2">Add to Cart</span>
        </button>
      </div>
    </div>
  </div>
</div>
