<div class="card mb-4">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-5">
        <label for="productName" class="form-label">Product Name</label>
        <input
          type="text"
          class="form-control"
          id="productName"
          placeholder="e.g. Laptop"
          [(ngModel)]="productName"
          (keyup.enter)="onApply()"
        />
      </div>
      <div class="col-md-5">
        <label for="brandName" class="form-label">Brand</label>
        <input
          type="text"
          class="form-control"
          id="brandName"
          placeholder="e.g. ACME"
          [(ngModel)]="brandName"
          (keyup.enter)="onApply()"
        />
      </div>
      <div class="col-md-2 d-flex align-items-end gap-2">
        <button type="button" class="btn btn-primary" (click)="onApply()">Apply</button>
        <button type="button" class="btn btn-secondary" (click)="onReset()">Reset</button>
      </div>
    </div>
  </div>
</div>
