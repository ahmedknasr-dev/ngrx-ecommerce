<div class="d-flex flex-wrap justify-content-between align-items-center mt-4 gap-3">
  <div class="d-flex align-items-center gap-2">
    <span class="text-nowrap">Page:</span>
    <nav>
      <ul class="pagination mb-0">
        <li [class.disabled]="currentPage() === 1" class="page-item">
          <button
            class="page-link"
            type="button"
            [disabled]="currentPage() === 1"
            (click)="onPageChange(currentPage() - 1)"
          >
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>
        @for (page of pages(); track page) {
          <li [class.active]="page === currentPage()" class="page-item">
            <button class="page-link" type="button" (click)="onPageChange(page)">
              {{ page }}
            </button>
          </li>
        }
        <li [class.disabled]="currentPage() === totalPages()" class="page-item">
          <button
            class="page-link"
            type="button"
            [disabled]="currentPage() === totalPages()"
            (click)="onPageChange(currentPage() + 1)"
          >
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>

  <div class="d-flex align-items-center gap-2">
    <label for="pageSize" class="mb-0 text-nowrap">Size:</label>
    <input
      type="number"
      id="pageSize"
      class="form-control form-control-sm page-size-input"
      min="1"
      [value]="pageSize()"
      (change)="onSizeChange(+$any($event.target).value)"
    />
  </div>
</div>
