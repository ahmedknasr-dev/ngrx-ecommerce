<div class="card h-100">
  <div class="bg-light p-3 text-center">
    <img
      [ngSrc]="product().imageUrl"
      [alt]="product().productName"
      width="150"
      height="150"
      class="img-fluid rounded"
    />
  </div>
  <div class="card-body d-flex flex-column">
    <h6 class="card-title text-truncate" [title]="product().productName">{{ product().productName }}</h6>
    <p class="card-text text-primary fw-bold mb-3">{{ product().price | currency }}</p>
    <button class="btn btn-primary btn-sm mt-auto" type="button" (click)="onViewDetails()">View Details</button>
  </div>
</div>
