<div class="row">
  <!-- Product Image -->
  <div class="col-lg-6 mb-4 mb-lg-0">
    <div class="bg-light p-4 rounded text-center">
      <img
        [ngSrc]="product().imageUrl"
        [alt]="product().productName"
        width="400"
        height="300"
        class="img-fluid rounded"
        priority
      />
    </div>
  </div>

  <!-- Product Details -->
  <div class="col-lg-6">
    <h3 class="mb-3">{{ product().productName }}</h3>

    <div class="mb-3">
      <span class="text-muted">Brand:</span>
      <strong>{{ product().brandName }}</strong>
    </div>

    <div class="mb-4">
      <h4 class="text-primary">{{ product().price | currency }}</h4>
    </div>

    <!-- Quantity Selector -->
    <div class="mb-4">
      <label class="form-label fw-bold">Quantity</label>
      <div class="d-flex align-items-center gap-3">
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="onDecreaseQuantity()"
          [disabled]="quantity() <= 1"
        >
          <i class="bi bi-dash"></i>
        </button>
        <span class="fs-5 px-3">{{ quantity() }}</span>
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="onIncreaseQuantity()"
          [disabled]="quantity() >= product().quantity"
        >
          <i class="bi bi-plus"></i>
        </button>
        <span class="text-muted ms-3">{{ product().quantity }} available</span>
      </div>
    </div>

    <!-- Add to Cart Button -->
    <button
      class="btn btn-primary btn-lg mb-4"
      type="button"
      (click)="onAddToCart()"
      [disabled]="product().quantity === 0"
    >
      <i class="bi bi-cart-plus me-2"></i>
      Add to Cart
    </button>

    <!-- Description -->
    <div class="mb-3">
      <h5 class="mb-3">Description</h5>
      <p class="text-muted">{{ product().description }}</p>
    </div>
  </div>
</div>
